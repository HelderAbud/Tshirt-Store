spring:
  application:
    name: loja-revenda-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/loja_revenda}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_enum_jdbc_type: VARCHAR
  flyway:
    enabled: true
    # BCrypt hashes in migrations contain '$' — keep literal
    placeholder-replacement: false

server:
  # Host 8084 — matriz portfólio
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Tshirt-Store API (MVP e-commerce camisetas)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET}

